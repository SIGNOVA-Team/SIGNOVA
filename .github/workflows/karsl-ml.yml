name: KArSL 502 ML smoke tests

on:
  push:
    paths:
      - "karsl/ml/**"
      - ".github/workflows/karsl-ml.yml"
  pull_request:
    paths:
      - "karsl/ml/**"
      - ".github/workflows/karsl-ml.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install uv==0.13.4
      - run: uv venv .venv --python 3.12
      - run: uv pip sync karsl/ml/requirements_502_cpu_py312.lock.txt --python .venv/bin/python --torch-backend cpu --require-hashes
      - run: .venv/bin/python -m unittest discover -s karsl/ml/tests -v
