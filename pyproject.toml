[project]
name = "signova"
version = "0.1.0"
description = "SIGNOVA: Multimodal Sign Language & Assistive Communication Pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SIGNOVA Team" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    "notebooks",
    "karsl/notebooks",
    "docs",
    "*.md",
]
extend-exclude = [
    "karsl/ml/ml_expansion/scripts",
    "karsl/ml/runbooks",
    "karsl/ml/src/preprocessing.py",
    "karsl/ml/training/train_gru_502.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "karsl", "wlasl", "isharah500", "ml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "karsl/tests", "isharah500/tests", "ml/sign_language/tests"]
pythonpath = [".", "karsl", "isharah500", "isharah500/src", "ml", "ml/sign_language"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", "karsl/tests", ".pytest_cache", ".git"]
skips = ["B310"]
